<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logos/app-icon-cream.png" />
    <link rel="apple-touch-icon" href="/assets/logos/app-icon-cream.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F2EA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>UnLitigate — Mediation first</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f2ea;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        width: min(22rem, 86vw);
      }
      .preloader-bench {
        width: 100%;
        height: 4.5rem;
        overflow: visible;
      }
      .preloader-bench .rail {
        stroke: #1f2a2e;
        stroke-width: 1.6;
        stroke-linecap: round;
        opacity: 0.55;
        transform-origin: 160px 40px;
        animation: bench-shorten 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.15s;
      }
      .preloader-bench .figure {
        fill: #c9683f;
        animation: figure-meet 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.15s;
      }
      .preloader-bench .figure.left { --from: 28px; --to: 132px; }
      .preloader-bench .figure.right { --from: 292px; --to: 188px; }
      .preloader-logo {
        width: 4rem;
        height: 4rem;
        opacity: 0;
        transform: scale(0.86);
        animation: logo-in 0.55s ease forwards 1.35s;
      }
      .preloader-name {
        margin: 0;
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-size: 1.35rem;
        color: #1f2a2e;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: logo-in 0.55s ease forwards 1.5s;
      }
      @keyframes bench-shorten {
        from { transform: scaleX(1); }
        to { transform: scaleX(0.34); }
      }
      @keyframes figure-meet {
        from { transform: translateX(var(--from)); }
        to { transform: translateX(var(--to)); }
      }
      @keyframes logo-in {
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-bench .rail,
        .preloader-bench .figure,
        .preloader-logo,
        .preloader-name {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .preloader-bench .rail { transform: scaleX(0.34); }
        .preloader-bench .figure.left { transform: translateX(132px); }
        .preloader-bench .figure.right { transform: translateX(188px); }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading UnLitigate">
      <div class="preloader-stage">
        <svg class="preloader-bench" viewBox="0 0 320 72" aria-hidden="true">
          <line class="rail" x1="24" y1="40" x2="296" y2="40" />
          <circle class="figure left" cx="0" cy="40" r="7" />
          <circle class="figure right" cx="0" cy="40" r="7" />
        </svg>
        <img class="preloader-logo" src="/assets/logos/icon-teal-clay.png" alt="" width="64" height="64" />
        <p class="preloader-name">UnLitigate</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
