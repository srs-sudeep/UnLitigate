<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logos/app-icon-cream.png" />
    <link rel="apple-touch-icon" href="/assets/logos/app-icon-cream.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F2EA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>UnLitigate — Mediation first</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f2ea;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.25rem;
      }
      .preloader-mark img {
        width: 9rem;
        height: 9rem;
      }
      .preloader-thread {
        width: min(22rem, 78vw);
        height: 2rem;
      }
      .preloader-thread line {
        stroke: #1f2a2e;
        stroke-width: 2.4;
        stroke-linecap: round;
        opacity: 0.7;
        stroke-dasharray: 280;
        stroke-dashoffset: 280;
        animation: preloader-draw 1s ease forwards 0.12s;
      }
      .preloader-thread .end {
        fill: #f7f2ea;
        stroke: #1f2a2e;
        stroke-width: 1.8;
      }
      .preloader-thread .bead {
        fill: #c9683f;
        opacity: 0;
        animation: preloader-pop 0.4s ease forwards;
      }
      .preloader-thread .bead.b1 { animation-delay: 0.45s; }
      .preloader-thread .bead.b2 { animation-delay: 0.62s; }
      @keyframes preloader-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes preloader-pop {
        from { opacity: 0; transform: scale(0.4); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-thread line,
        .preloader-thread .bead {
          animation: none;
          opacity: 1;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading UnLitigate">
      <div class="preloader-mark">
        <img src="/assets/logos/icon-teal-clay.png" alt="" width="144" height="144" />
        <svg class="preloader-thread" viewBox="0 0 300 28" aria-hidden="true">
          <line x1="14" y1="14" x2="286" y2="14" />
          <circle class="end" cx="14" cy="14" r="6.5" />
          <circle class="bead b1" cx="105" cy="14" r="5.5" />
          <circle class="bead b2" cx="195" cy="14" r="5.5" />
          <circle class="end" cx="286" cy="14" r="6.5" />
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
